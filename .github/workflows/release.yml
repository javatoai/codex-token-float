name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check release version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("mygo.json"))["version"])')
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Expected tag v%s, got %s\n' "$version" "$GITHUB_REF" >&2
            exit 1
          fi

  build:
    needs: check-tag
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: Codex-Token-Float-*
      - name: Verify release files
        shell: bash
        run: |
          mkdir release
          version=${GITHUB_REF_NAME#v}
          for target in windows-x64.exe macos-universal.dmg; do
            platform=${target%.*}
            artifact="artifacts/Codex-Token-Float-$platform"
            application="Codex-Token-Float-$version-$target"
            (cd "$artifact" && checksum=$(sha256sum -- "$application") && test "$checksum" = "$(cat SHA256SUMS.txt)" && printf '%s\n' "$checksum")
            cp -- "$artifact/$application" release/
          done
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          expected=$(cd release && printf '%s\n' *.dmg *.exe | sort)
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == false ]]; then
              actual=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | map(.name) | sort | .[]')
              test "$actual" = "$expected"
              echo "Release $GITHUB_REF_NAME is already published."
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Codex Token Float $GITHUB_REF_NAME" --notes-from-tag
          fi
          gh release upload "$GITHUB_REF_NAME" release/*.dmg release/*.exe --clobber
          actual=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | map(.name) | sort | .[]')
          test "$actual" = "$expected"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
